<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mesa de Estudos · banner do README</title>
<link rel="stylesheet" href="release.css">
<style>
 .peca{width:1600px;height:400px;display:grid;grid-template-columns:1fr 640px;align-items:center;padding:48px 64px}
 .texto{display:flex;align-items:center;gap:36px}
 .logo{width:136px;height:136px;flex:none}
 h1{font-size:68px;line-height:1;font-weight:650;letter-spacing:-.025em;color:var(--fg-strong)}
 p{margin-top:16px;font-size:26px;line-height:1.35;color:var(--muted)}
 .palco{height:304px;background:var(--accent-tint);border-radius:24px;display:flex;flex-direction:column;justify-content:center;padding:16px 40px 0}
 .trio{display:flex;align-items:flex-end;justify-content:center}
 .trio .mascote{--fo-size:200px}
 .trio .mascote+.mascote{margin-left:-6px}
 .chao{margin:-14px 16px 0}
</style>
</head>
<body>
<main class="peca">
 <section class="texto">
  <div class="logo" data-logo></div>
  <div>
   <h1 data-t="nome">Mesa de Estudos</h1>
   <p data-t="tagline">PDFs e tutor ao lado do caderno digital.</p>
  </div>
 </section>
 <section class="palco">
  <div class="trio">
   <div class="mascote mascote-integral" data-humor="lendo" data-trio="integral"></div>
   <div class="mascote mascote-sigma mascote-tallying" data-humor="normal" data-trio="sigma"></div>
   <div class="mascote mascote-nabla" data-humor="atento" data-trio="nabla"></div>
  </div>
  <div class="chao"></div>
 </section>
</main>
</body>
</html>
