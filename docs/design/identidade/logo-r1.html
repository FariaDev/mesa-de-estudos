<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo — rodada 1</title>
<!-- Protótipo da #61 (fase A). A fonte vem do Google Fonts só aqui; no app ela é embutida
     e, no ícone final, o "M" serifado vira contorno (sem depender de fonte). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#efefef,#1f1f1f);--card:light-dark(#fff,#2a2a2a);--fg:light-dark(#272727,#e4e4e4);--faint:light-dark(#737373,#a3a3a3);--line:light-dark(#dcdcdc,#3a3a3a)}
body{margin:0;padding:24px 16px 64px;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}
.lead{color:var(--faint);margin:0 0 24px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:15px;margin:0 0 2px}
.card p{margin:0 0 12px;color:var(--faint);font-size:13px}
.big svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto 12px}
.sizes{display:flex;align-items:flex-end;gap:14px;justify-content:center;padding:12px;border-radius:10px}
.sizes.light{background:#e9e9ec}.sizes.dark{background:#1b1b1d;margin-top:8px}
.sizes svg{display:block}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
</style>
</head>
<body>
<h1>Logo e ícone do app — rodada 1</h1>
<p class="lead">Quatro caminhos, todos no violeta atual. Cada cartão mostra o ícone grande e nos tamanhos reais (128, 64, 32 e 16 px) sobre fundo claro e escuro, como no Dock e na barra de tarefas. O primeiro cartão é o de hoje, para comparar.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <linearGradient id="roxo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
  <!-- Hoje: M da fonte do sistema sobre violeta chapado (desk/assets/mesa.svg). -->
  <symbol id="atual" viewBox="0 0 1024 1024">
   <rect width="1024" height="1024" rx="230" fill="#5b21b6"/>
   <text x="512" y="698" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="540" font-weight="700" fill="#fff">M</text>
  </symbol>
  <!-- A. Duas folhas: o leitor (texto) e o caderno (tinta), lado a lado como os dois apps. -->
  <symbol id="folhas" viewBox="0 0 1024 1024">
   <rect width="1024" height="1024" rx="230" fill="url(#roxo)"/>
   <g transform="rotate(-7 380 470)">
    <rect x="220" y="250" width="320" height="440" rx="34" fill="#fff"/>
    <path d="M286 360h188M286 440h188M286 520h120" stroke="#c4b5fd" stroke-width="30" stroke-linecap="round"/>
   </g>
   <g transform="rotate(6 650 560)">
    <rect x="490" y="340" width="320" height="440" rx="34" fill="#f3efff" stroke="#5b21b6" stroke-width="18"/>
    <path d="M556 520c30-60 60-60 70 0s40 60 70 0" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M556 640h188" stroke="#f59e0b" stroke-width="30" stroke-linecap="round" opacity=".55"/>
   </g>
  </symbol>
  <!-- B. M serifado: o M na STIX Two, a mesma serifa da Lista 0 e dos PDFs, sobre uma pauta. -->
  <symbol id="serifa" viewBox="0 0 1024 1024">
   <rect width="1024" height="1024" rx="230" fill="url(#roxo)"/>
   <text x="512" y="690" text-anchor="middle" font-family="'STIX Two Text',serif" font-size="600" font-weight="600" fill="#fff">M</text>
   <path d="M262 790h500" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/>
  </symbol>
  <!-- C. Lista 0: a folha que recebe quem abre a mesa vazia, com o primeiro item feito. -->
  <symbol id="lista" viewBox="0 0 1024 1024">
   <rect width="1024" height="1024" rx="230" fill="url(#roxo)"/>
   <rect x="262" y="176" width="500" height="672" rx="40" fill="#fff"/>
   <text x="512" y="372" text-anchor="middle" font-family="'STIX Two Text',serif" font-size="170" font-weight="600" fill="#4c1d95">0</text>
   <circle cx="356" cy="490" r="30" fill="#f59e0b"/>
   <path d="M342 490l11 11 20-22" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="356" cy="600" r="26" fill="none" stroke="#a78bfa" stroke-width="10"/>
   <circle cx="356" cy="710" r="26" fill="none" stroke="#a78bfa" stroke-width="10"/>
   <path d="M422 490h250M422 600h250M422 710h170" stroke="#d4d4d8" stroke-width="30" stroke-linecap="round"/>
  </symbol>
  <!-- D. Tampo: a mesa vista de frente, com uma folha e um lápis em cima. -->
  <symbol id="tampo" viewBox="0 0 1024 1024">
   <rect width="1024" height="1024" rx="230" fill="url(#roxo)"/>
   <g transform="rotate(-6 420 470)">
    <rect x="290" y="270" width="270" height="350" rx="28" fill="#fff"/>
    <path d="M346 370h158M346 440h158M346 510h96" stroke="#c4b5fd" stroke-width="26" stroke-linecap="round"/>
   </g>
   <path d="M640 600 790 330" stroke="#f59e0b" stroke-width="54" stroke-linecap="round"/>
   <path d="M640 600 790 330" stroke="#fde68a" stroke-width="14" stroke-linecap="round" opacity=".8"/>
   <rect x="170" y="620" width="684" height="66" rx="24" fill="#fff"/>
   <rect x="240" y="686" width="54" height="170" rx="18" fill="#fff" opacity=".85"/>
   <rect x="730" y="686" width="54" height="170" rx="18" fill="#fff" opacity=".85"/>
  </symbol>
 </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
// Monta os cartões a partir dos símbolos acima (um só desenho por variante).
const variants=[
 ['atual','Hoje','M da fonte do sistema. Não carrega a identidade nova e depende da fonte instalada.'],
 ['folhas','A · Duas folhas','O leitor e o caderno lado a lado: diz o que o app é (a mesa ao lado do Xournal++).'],
 ['serifa','B · M serifado','O M na STIX Two, amarrando o ícone à serifa nova. Pauta âmbar embaixo.'],
 ['lista','C · Lista 0','A folha de boas-vindas com o primeiro item feito: estudo como lista a cumprir.'],
 ['tampo','D · Tampo','A mesa de frente, folha e lápis em cima. Mais literal, perde detalhe em 16 px.'],
];
const use=(id,size)=>`<svg width="${size}" height="${size}" role="img" aria-label="${id}"><use href="#${id}"/></svg>`;
document.getElementById('grid').innerHTML=variants.map(([id,name,note])=>`
 <section class="card">
  <span class="tag">${id==='atual'?'referência':'proposta'}</span>
  <h2>${name}</h2><p>${note}</p>
  <div class="big">${use(id,220)}</div>
  <div class="sizes light">${[128,64,32,16].map(s=>use(id,s)).join('')}</div>
  <div class="sizes dark">${[128,64,32,16].map(s=>use(id,s)).join('')}</div>
 </section>`).join('');
</script>
</body>
</html>
