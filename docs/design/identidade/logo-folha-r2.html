<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo da folha — rodada 2</title>
<!-- #61, rodada 2: meio-termo entre A (séria, mas genérica) e B (simpática, mas infantil).
     Gerado a partir de logo-folha-r1.html. Logo do app a partir da Folhinha (mascote aprovado), e reativa à cor de acento
     das configurações. As cores são os valores claros de --acc-* em desk/style.css. O "M"
     da variante C vira contorno no SVG final, sem depender de fonte. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@600&display=swap">
<style>
body{margin:0;padding:24px 16px 64px;background:#efefef;color:#272727;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}
.lead{color:#737373;margin:0 0 20px;max-width:76ch}
.card{background:#fff;border:1px solid #dcdcdc;border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0}
.card p{margin:2px 0 12px;color:#737373;font-size:13px}
.linha{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.grande svg{width:180px;height:180px;display:block}
.cores{display:grid;grid-template-columns:repeat(6,auto);gap:10px 14px;align-items:end;justify-content:start}
.cores figure{margin:0;text-align:center}
.cores figcaption{font-size:10px;color:#8a8a8a}
.dock{display:flex;gap:10px;align-items:flex-end;padding:8px 12px;border-radius:14px;margin-top:10px;width:max-content}
.dock.claro{background:#e4e4e7}.dock.escuro{background:#1c1c1e}
</style>
</head>
<body>
<h1>Logo da folha — rodada 2: entre a A e a B</h1>
<p class="lead">A A ficou genérica e a B ficou infantil. Aqui a lista de exercício da A ganha só um pouco da Folhinha, cada versão de um jeito. Nenhuma tem boca, que era o que deixava a B com cara de criança. As cores e o Dock seguem o mesmo formato da rodada 1.</p>
<div id="out"></div>
<script>
const ACENTOS=[['azul','#2548c7'],['violeta','#6d28d9'],['verde','#0f7b55'],['laranja','#c2410c'],['rosa','#c02667'],['grafite','#27272a']];
const FOLHA='M300 172H632L762 302V814Q762 852 724 852H300Q262 852 262 814V210Q262 172 300 172Z';
const DOBRA='<path d="M632 172V262Q632 302 672 302H762Z" fill="#d9d3c4"/>';
const TINTA='#1a1033',AMBAR='#e8862a',RISCO='#c9c1ad';
const traco=(d,cor,w)=>`<path d="${d}" fill="none" stroke="${cor}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
// Fundo do ícone: o acento com um degradê leve (mais claro em cima), e a sombra da folha.
let n=0;
const fundo=(cor,id)=>`<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in oklab,${cor} 78%,white)"/><stop offset="1" style="stop-color:color-mix(in oklab,${cor} 88%,black)"/></linearGradient><filter id="s${id}" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/></filter></defs><rect width="1024" height="1024" rx="230" fill="url(#g${id})"/>`;
const folha=(id,miolo,giro=0)=>`<g transform="rotate(${giro} 512 512)"><g filter="url(#s${id})"><path d="${FOLHA}" fill="#fffbf0"/></g>${DOBRA}${miolo}</g>`;
const LISTA=traco('M326 560l28 28 58-66',AMBAR,30)+traco('M460 560H690',RISCO,32)+traco('M330 664H640M330 768H680',RISCO,32);
const olhoAberto=([x,y],r,baixo)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${TINTA}" stroke-width="14"/><circle cx="${x+6}" cy="${y+baixo}" r="${r*.48}" fill="${TINTA}"/><circle cx="${x+16}" cy="${y+baixo-12}" r="${r*.16}" fill="#fff"/>`;
// Pálpebra a meio caminho: a metade de cima do olho some sob a cor do papel, com um traço reto.
const olhoConcentrado=([x,y],r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${TINTA}" stroke-width="14"/><circle cx="${x+4}" cy="${y+26}" r="${r*.46}" fill="${TINTA}"/><path d="M${x-r-8} ${y}A${r+8} ${r+8} 0 0 1 ${x+r+8} ${y}Z" fill="#fffbf0"/>`+traco(`M${x-r-4} ${y}H${x+r+4}`,TINTA,14);
const variantes=[
 {nome:'H1 · Olhando a lista',nota:'A lista da A com os olhos da Folhinha olhando para baixo, para o exercício. Sem boca: é alguém estudando, não sorrindo para a câmera.',
  miolo:()=>olhoAberto([420,372],62,22)+olhoAberto([600,362],64,22)+LISTA,giro:-4},
 {nome:'H2 · Olhos de ponto',nota:'Dois pontinhos no lugar dos olhos grandes. O mínimo de rosto que ainda se lê; na linha das ilustrações de app de notas.',
  miolo:()=>`<circle cx="432" cy="384" r="28" fill="${TINTA}"/><circle cx="592" cy="374" r="28" fill="${TINTA}"/><circle cx="442" cy="374" r="8" fill="#fff"/><circle cx="602" cy="364" r="8" fill="#fff"/>`+LISTA,giro:-4},
 {nome:'H3 · Concentrada',nota:'Olhos meio fechados, focados na lista. É o rosto mais "adulto": não é fofo, é alguém resolvendo o exercício.',
  miolo:()=>olhoConcentrado([420,384],62)+olhoConcentrado([600,374],64)+LISTA,giro:-4},
 {nome:'H4 · Com o lápis',nota:'Sem rosto. A personalidade vem do lápis âmbar da Folhinha, que está terminando o visto. Séria como a A, mas com o lápis que é só nosso.',
  miolo:()=>traco('M326 470l30 30 62-70',AMBAR,34)+traco('M330 600H630M330 720H680',RISCO,36)
   +`<path d="M452 412 660 160" stroke="${AMBAR}" stroke-width="62"/><path d="M660 160 692 121" stroke="#f08fa8" stroke-width="62"/>`
   +`<path d="M412 446 432 392 474 426Z" fill="#f3d6a8"/><path d="M412 446 419 427 433 438Z" fill="#3f3f46"/>`,giro:-4},
];
const icone=(v,cor,w)=>{const id=n++;return `<svg viewBox="0 0 1024 1024" width="${w}" height="${w}" role="img" aria-label="${v.nome}">${fundo(cor,id)}${folha(id,v.miolo(cor),v.giro||0)}</svg>`;};
document.getElementById('out').innerHTML=variantes.map(v=>`
 <section class="card"><h2>${v.nome}</h2><p>${v.nota}</p>
  <div class="linha">
   <div class="grande">${icone(v,ACENTOS[0][1],180)}</div>
   <div>
    <div class="cores">${ACENTOS.map(([nome,cor])=>`<figure>${icone(v,cor,72)}<figcaption>${nome}</figcaption></figure>`).join('')}</div>
    <div class="dock claro">${ACENTOS.slice(0,3).map(([,cor])=>[64,32,16].map(s=>icone(v,cor,s)).join('')).join('')}</div>
    <div class="dock escuro">${ACENTOS.slice(3).map(([,cor])=>[64,32,16].map(s=>icone(v,cor,s)).join('')).join('')}</div>
   </div>
  </div>
 </section>`).join('');
</script>
</body>
</html>
